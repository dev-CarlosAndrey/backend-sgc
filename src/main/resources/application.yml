spring:
  application:
    name: sgc-api

  # Configuração da Base de Dados (MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sgc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Configuração do JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Configuração do Flyway para Versionamento do Banco de Dados
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Configuração de upload de arquivos (multipart)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Configurações do Servidor Tomcat
server:
  port: ${PORT:8080}

# Configuração de armazenamento de arquivos enviados (uploads)
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}

# Notificações (WhatsApp com fallback por e-mail)
notification:
  fallback-enabled: ${NOTIFICATION_FALLBACK_ENABLED:true}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
  retry-backoff-ms: ${NOTIFICATION_RETRY_BACKOFF_MS:1000}

# Configuração da integração com o WhatsApp Cloud API (Meta) — substitui a Evolution API
# (decisão registrada em PLANO_IMPLEMENTACAO_MVP.md, seção 0.2; em teste, ainda não consumida por nenhum bean)
whatsapp:
  cloud-api:
    base-url: ${WHATSAPP_CLOUD_API_BASE_URL:https://graph.facebook.com/v22.0}
    access-token: ${WHATSAPP_ACCESS_TOKEN:defina_no_ambiente}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:defina_no_ambiente}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:defina_no_ambiente}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:defina_no_ambiente}
    app-secret: ${WHATSAPP_APP_SECRET:defina_no_ambiente}

# Configuração do SendGrid (fallback de notificação por e-mail quando o WhatsApp falhar)
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:carlos.andrey@alu.fpo.edu.br}
  base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com}
  from-name: ${SENDGRID_FROM_NAME:SGC - Controle Patrimonial}

# Configuração de Segurança (JWT)
api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key-fpo-sgc-2026-super-segura}